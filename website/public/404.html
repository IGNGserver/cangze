<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面未找到 · 藏泽 Cangze</title>
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <style>
      :root {
        --bg: #faf6f0;
        --bg-glow: rgba(200, 109, 45, 0.12);
        --card: #ffffff;
        --ink: #2b231d;
        --muted: #5e5247;
        --accent: #c86d2d;
        --accent-ink: #ffffff;
        --border: rgba(92, 68, 46, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 18%, var(--bg-glow), transparent 56%), var(--bg);
        color: var(--ink);
        font-family:
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      .card {
        max-width: 480px;
        width: 100%;
        padding: 36px 32px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 18px 42px rgba(58, 40, 22, 0.08);
        text-align: center;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(200, 109, 45, 0.1);
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
      }

      h1 {
        margin: 0 0 12px;
        font-family: 'Songti SC', 'STSong', 'Noto Serif SC', Georgia, serif;
        font-size: 24px;
        font-weight: 700;
      }

      p {
        margin: 0 0 24px;
        font-size: 14.5px;
        line-height: 1.7;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 22px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }

      .btn-ghost {
        background: #f2eae0;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">404 · 迷路啦</span>
      <h1>找不到这个页面</h1>
      <p>你打开的链接可能已经更换位置了。欢迎回到藏泽首页，逛逛这个会听家常话的小家。</p>
      <div class="actions">
        <a class="btn" href="/">回到藏泽首页</a>
        <a class="btn btn-ghost" href="https://github.com/IGNGserver/cangze" rel="noopener"> 前往 GitHub </a>
      </div>
    </main>
  </body>
</html>
