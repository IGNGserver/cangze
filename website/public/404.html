<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面未找到 · 藏泽 Cangze</title>
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <style>
      :root {
        --bg: #090d14;
        --bg-glow: rgba(245, 169, 98, 0.14);
        --card: rgba(18, 24, 36, 0.86);
        --ink: #f3efe8;
        --muted: #a6b0c3;
        --accent: #f5a962;
        --accent-ink: #1a1208;
        --border: rgba(245, 169, 98, 0.24);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f3ee;
          --bg-glow: rgba(196, 118, 43, 0.12);
          --card: rgba(255, 255, 255, 0.92);
          --ink: #181c24;
          --muted: #525d70;
          --accent: #b8661d;
          --accent-ink: #ffffff;
          --border: rgba(184, 102, 29, 0.22);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 18%, var(--bg-glow), transparent 56%), var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
          sans-serif;
      }

      .card {
        max-width: 480px;
        width: 100%;
        padding: 36px 32px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        backdrop-filter: blur(18px);
        text-align: center;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--accent);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        font-weight: 650;
      }

      p {
        margin: 0 0 24px;
        font-size: 14.5px;
        line-height: 1.7;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 22px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }

      .btn-ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">404 · 泽居未寻获此径</span>
      <h1>找不到这个页面</h1>
      <p>
        你访问的链接可能已移动或不存在。欢迎返回藏泽（Cangze）官网首页，探索 3D
        智能住宅、权限审批闭环与单容器私有部署方案。
      </p>
      <div class="actions">
        <a class="btn" href="/">返回官网首页</a>
        <a class="btn btn-ghost" href="https://github.com/IGNGserver/cangze" rel="noopener"> GitHub 仓库 </a>
      </div>
    </main>
  </body>
</html>
