name: ci

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'docs/openapi.json'
      - '.github/workflows/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.yaml'
      - 'Dockerfile'
      - 'VERSION'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'docs/openapi.json'
      - '.github/workflows/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.yaml'
      - 'Dockerfile'
      - 'VERSION'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (lint · typecheck · test · contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build

  image:
    name: image (build · compose · smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml --profile https config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cangze:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run -d --name cangze -p 8080:8080 cangze:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:8080/api/v1/system/info | tee info.json
          grep -q '"name":"cangze"' info.json
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
      - name: container logs
        if: always()
        run: docker logs cangze || true
