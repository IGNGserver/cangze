name: ci

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'docs/openapi.json'
      - '.github/workflows/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.yaml'
      - 'Dockerfile'
      - 'VERSION'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'docs/openapi.json'
      - '.github/workflows/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.yaml'
      - 'Dockerfile'
      - 'VERSION'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (lint · typecheck · test · contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build

  e2e:
    name: e2e (playwright · fake HA · fake model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cangze/web build
      - name: playwright version
        id: pw
        run: echo "version=$(pnpm --filter @cangze/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter @cangze/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @cangze/e2e test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  ha-integration:
    name: ha-integration (real Home Assistant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: start Home Assistant
        run: |
          docker run -d --name homeassistant -p 8123:8123 -e TZ=Europe/Berlin \
            ghcr.io/home-assistant/home-assistant:stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: onboard Home Assistant
        run: node scripts/ha-onboard.mjs http://127.0.0.1:8123 >> "$GITHUB_ENV"
      - name: integration tests
        run: |
          docker exec homeassistant python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
          CANGZE_REAL_HA_REQUIRED=1 pnpm vitest run --project server apps/server/test/real-ha.test.ts
      - name: Home Assistant log
        if: failure()
        run: docker logs homeassistant 2>&1 | tail -200

  image:
    name: image (build · compose · smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml --profile https config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cangze:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run -d --name cangze -p 8080:8080 cangze:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:8080/api/v1/system/info | tee info.json
          grep -q '"name":"cangze"' info.json
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
      - name: container logs
        if: always()
        run: docker logs cangze || true
