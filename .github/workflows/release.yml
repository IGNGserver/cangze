name: release

# 推 v*.*.* tag 触发；默认发布 prerelease（镜像打版本号与 next 标签）。
# 只有手动触发并选择 release 时才发布正式版并更新镜像 latest 标签。
# Compose 和环境模板作为 Release 资产发布，用户不从 main 获取部署文件。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.2'
        required: true
      release_type:
        description: 'prerelease or release'
        type: choice
        options: [prerelease, release]
        default: prerelease

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      FORMAL: ${{ github.event.inputs.release_type == 'release' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: check tag matches VERSION
        run: |
          test "v$(cat VERSION)" = "$TAG" || { echo "tag $TAG does not match VERSION $(cat VERSION)"; exit 1; }
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: check immutable version image
        id: image
        env:
          IMAGE: ghcr.io/igngserver/cangze
        run: |
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
          set +e
          inspection=$(docker buildx imagetools inspect "$IMAGE:${TAG#v}" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing immutable $IMAGE:${TAG#v}; it will not be overwritten"
          elif printf '%s' "$inspection" | grep -Eqi 'not found|no such manifest|unknown: artifact'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$inspection"
            echo "Could not verify whether the immutable image exists" >&2
            exit 1
          fi
      - name: build immutable version image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/igngserver/cangze:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/IGNGserver/cangze
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: move only the mutable channel alias
        env:
          IMAGE: ghcr.io/igngserver/cangze
        run: |
          version="${TAG#v}"
          if [ "$FORMAL" = "true" ]; then channel=latest; else channel=next; fi
          docker buildx imagetools create --tag "$IMAGE:$channel" "$IMAGE:$version"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/${TAG}.md"
          flags=()
          if [ "$FORMAL" != "true" ]; then flags+=(--prerelease); fi
          if [ -f "$notes" ]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
          # GitHub stores a leading-dot asset as default.env.example; publish a visible copy.
          cp .env.example env.example
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; not modifying a published release"
          else
            gh release create "$TAG" compose.yaml env.example \
              --title "Cangze $TAG" --verify-tag "${flags[@]}"
          fi
